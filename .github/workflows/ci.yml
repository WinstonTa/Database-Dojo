name: Database Dojo CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  statuses: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate curriculum and fixtures
        run: npm run validate
      - name: TypeScript check
        run: npm run typecheck
      - name: Execute all PostgreSQL challenges and lecture SQL
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run test:sql > sql-test-output.txt 2>&1 || {
            cat sql-test-output.txt
            node scripts/report-sql-error.mjs sql-test-output.txt
            exit 1
          }
          cat sql-test-output.txt
      - name: Build production app
        run: npm run build
